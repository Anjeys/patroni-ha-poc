---
# Everything that can be checked without a cluster. The drills need systemd
# containers and a few minutes each; they run by hand and write evidence, and
# the README says so rather than pretending CI covers them.
name: lint

"on":
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  ansible:
    name: ansible-lint and yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ansible-core ansible-lint yamllint

      # The roles reference collections; without them lint reports modules that
      # exist as if they did not.
      - name: Collections
        run: ansible-galaxy collection install -r requirements.yml

      # A playbook that cannot be parsed is a playbook that cannot run, and the
      # inventory names hosts this syntax check needs to resolve.
      - name: Syntax
        run: ansible-playbook playbook.yml --syntax-check

      - name: ansible-lint
        run: ansible-lint

      - name: yamllint
        run: yamllint .

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax and shellcheck
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning scripts/*.sh

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Passwords are generated per lab and gitignored, but a scan is the only
      # thing that proves it stayed that way.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
