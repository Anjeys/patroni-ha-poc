# One key pair generated on the control node, copied out: the postgres user
# exists once postgresql-common is installed (role pgdg), and Patroni's first
# WAL goes to pgbackrest archive-push, so the mesh must be in place before it.
---
- name: .ssh for postgres
  ansible.builtin.file:
    path: /var/lib/postgresql/.ssh
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Mesh private key
  ansible.builtin.copy:
    src: ../../../.ssh/pgbackrest_ed25519
    dest: /var/lib/postgresql/.ssh/id_ed25519
    owner: postgres
    group: postgres
    mode: "0600"

# ansible.posix.authorized_key does this too, and it was the repository's only
# Galaxy dependency. galaxy.ansible.com answered 500 for an hour and every run
# went red for it; a pipeline that a third party can fail teaches people to
# ignore red. One generated key, appended once, no collection behind it.
- name: Mesh public key is authorized everywhere
  ansible.builtin.lineinfile:
    path: /var/lib/postgresql/.ssh/authorized_keys
    line: "{{ lookup('file', '../../../.ssh/pgbackrest_ed25519.pub') | trim }}"
    create: true
    owner: postgres
    group: postgres
    mode: "0600"

- name: Host keys change on every rebuild; the lab network is private
  ansible.builtin.copy:
    dest: /var/lib/postgresql/.ssh/config
    content: |
      Host *
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
    owner: postgres
    group: postgres
    mode: "0600"
