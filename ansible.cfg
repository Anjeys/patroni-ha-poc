[defaults]
inventory = inventory.ini
host_key_checking = False
vault_password_file = .vault_pass
# become_user postgres has no home-side tmp on first use; /tmp always exists
remote_tmp = /tmp/.ansible-${USER}

[ssh_connection]
# Every compose up --build mints a new host key on the same address: a stale
# known_hosts entry must not block the run. The lab network is private.
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s
