---
- name: Install PgBouncer package
  apt:
    name:
      - "pgbouncer={{ pgbouncer_version }}"
      # psql on the access node: the drills and the smoke talk to 6432 from here.
      - "postgresql-client-{{ postgresql_version }}={{ postgresql_package_version }}"
    state: present

- name: Deploy userlist.txt
  template:
    src: userlist.txt.j2
    dest: /etc/pgbouncer/userlist.txt
    owner: postgres
    group: postgres
    mode: '0600'
  notify: Restart PgBouncer

- name: Deploy pgbouncer.ini configuration
  template:
    src: pgbouncer.ini.j2
    dest: /etc/pgbouncer/pgbouncer.ini
  notify: Restart PgBouncer

- name: Start PgBouncer service
  systemd:
    name: pgbouncer
    state: started
    enabled: yes
