---
- name: Download the pinned postgres_exporter release
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus-community/postgres_exporter/releases/download/v{{
      postgres_exporter_version }}/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64.tar.gz
    dest: "/usr/local/src/postgres_exporter-{{ postgres_exporter_version }}.tar.gz"
    checksum: "sha256:{{ postgres_exporter_sha256 }}"
    mode: "0644"

- name: Unpack postgres_exporter
  ansible.builtin.unarchive:
    src: "/usr/local/src/postgres_exporter-{{ postgres_exporter_version }}.tar.gz"
    dest: /usr/local/src
    remote_src: true
    creates: "/usr/local/src/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64/postgres_exporter"

- name: Install postgres_exporter
  ansible.builtin.copy:
    src: "/usr/local/src/postgres_exporter-{{ postgres_exporter_version }}.linux-amd64/postgres_exporter"
    dest: /usr/local/bin/postgres_exporter
    remote_src: true
    mode: "0755"
  notify: Restart postgres_exporter

# It runs as postgres over the unix socket: peer authentication, no password
# in a unit file, and no TLS to configure for a local connection.
- name: Postgres_exporter unit
  ansible.builtin.template:
    src: postgres_exporter.service.j2
    dest: /etc/systemd/system/postgres_exporter.service
    mode: "0644"
  notify: Restart postgres_exporter

- name: Start postgres_exporter
  ansible.builtin.systemd:
    name: postgres_exporter
    state: started
    enabled: true
    daemon_reload: true
