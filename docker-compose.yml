---
# LAB_NET picks the second octet (default 18): scripts/lab.sh moves it when the
# subnet is taken. Clients reach the access layer on 172.<LAB_NET>.0.100, which
# keepalived moves between balancer and balancer2. Backups live on their own
# host so that losing a balancer never touches the repository. privileged:
# systemd as PID 1; needs no cgroup bind on cgroup v2 (probed).
services:
  node1:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: node1
    hostname: node1
    privileged: true
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - pgdata1:/var/lib/postgresql
    networks:
      patroni_net:
        ipv4_address: 172.${LAB_NET:-18}.0.2

  node2:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: node2
    hostname: node2
    privileged: true
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - pgdata2:/var/lib/postgresql
    networks:
      patroni_net:
        ipv4_address: 172.${LAB_NET:-18}.0.3

  node3:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: node3
    hostname: node3
    privileged: true
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - pgdata3:/var/lib/postgresql
    networks:
      patroni_net:
        ipv4_address: 172.${LAB_NET:-18}.0.4

  balancer:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: balancer
    hostname: balancer
    privileged: true
    tmpfs: [/run, /run/lock, /tmp]
    networks:
      patroni_net:
        ipv4_address: 172.${LAB_NET:-18}.0.5

  balancer2:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: balancer2
    hostname: balancer2
    privileged: true
    tmpfs: [/run, /run/lock, /tmp]
    networks:
      patroni_net:
        ipv4_address: 172.${LAB_NET:-18}.0.6

  backup:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: backup
    hostname: backup
    privileged: true
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - backup_data:/var/lib/pgbackrest
    networks:
      patroni_net:
        ipv4_address: 172.${LAB_NET:-18}.0.7

networks:
  patroni_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.${LAB_NET:-18}.0.0/16

volumes:
  pgdata1:
  pgdata2:
  pgdata3:
  backup_data:
