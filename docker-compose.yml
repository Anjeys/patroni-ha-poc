---
services:
  node1:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: node1
    hostname: node1
    privileged: true   # systemd as PID 1; needs no cgroup bind on cgroup v2 (probed)
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - pgdata1:/var/lib/postgresql
    networks:
      patroni_net:
        ipv4_address: 172.18.0.2

  node2:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: node2
    hostname: node2
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - pgdata2:/var/lib/postgresql
    networks:
      patroni_net:
        ipv4_address: 172.18.0.3

  node3:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: node3
    hostname: node3
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - pgdata3:/var/lib/postgresql
    networks:
      patroni_net:
        ipv4_address: 172.18.0.4

  balancer:
    build:
      context: .
      args:
        SSH_PUBKEY: ${SSH_PUBKEY:?run scripts/lab.sh up}
    container_name: balancer
    hostname: balancer
    privileged: true
    ports:
      - "5000:5000"
      - "5001:5001"
      - "6432:6432"
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - backup_data:/var/lib/pgbackrest
    networks:
      patroni_net:
        ipv4_address: 172.18.0.5

networks:
  patroni_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  pgdata1:
  pgdata2:
  pgdata3:
  backup_data:
