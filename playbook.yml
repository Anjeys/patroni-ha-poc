---
# Плей для кластера баз данных (etcd + Patroni)
- name: Setup PostgreSQL HA Cluster (etcd + Patroni)
  hosts: etcd_nodes                          # Запускаем только на 3-х нодах
  become: yes                                # Выполняем с правами root (sudo)
  roles:
    - etcd                                   # Сначала ставим etcd (кворум)
    - patroni                                # Затем ставим Patroni и PostgreSQL

# Плей для балансировщика
- name: Setup HAProxy and PgBouncer
  hosts: balancer                            # Запускаем только на балансировщике
  become: yes
  roles:
    - balancer                               # Применяем логику роутинга
