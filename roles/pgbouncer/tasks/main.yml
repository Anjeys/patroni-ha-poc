---
- name: Установка пакета PgBouncer
  apt:
    name: pgbouncer
    state: present

- name: Накатываем userlist.txt (Пароли)
  template:
    src: userlist.txt.j2
    dest: /etc/pgbouncer/userlist.txt
    owner: postgres
    group: postgres
    mode: '0600'                               # Файл паролей должен быть скрыт
  notify: Restart PgBouncer

- name: Накатываем конфигурацию pgbouncer.ini
  template:
    src: pgbouncer.ini.j2
    dest: /etc/pgbouncer/pgbouncer.ini
  notify: Restart PgBouncer

- name: Разрешаем запуск PgBouncer в LSB скрипте
  lineinfile:
    path: /etc/default/pgbouncer
    regexp: '^START='
    line: 'START=1'
    state: present

- name: Запуск сервиса PgBouncer
  systemd:
    name: pgbouncer
    state: started
    enabled: yes
