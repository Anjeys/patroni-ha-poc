---
# Order: the repository host exists before Patroni writes its first WAL; the
# access layer before anything connects through it; the post-cluster play last.
- name: Backup repository host
  hosts: backup_hosts
  become: true
  roles:
    - pgdg
    - pgbackrest

- name: Database nodes
  hosts: etcd_nodes
  become: true
  roles:
    - pgdg
    - pgbackrest
    - etcd
    - patroni

- name: Access layer (two nodes behind one virtual address)
  hosts: balancers
  become: true
  roles:
    - pgdg
    - haproxy
    - pgbouncer
    - keepalived

- name: Once the cluster answers (auth_query role, stanza, first backup, schedule)
  hosts: backup_hosts
  become: true
  roles:
    - pgbouncer_auth
    - pgbackrest_repo
