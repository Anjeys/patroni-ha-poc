---
- name: Install PostgreSQL and Patroni
  apt:
    name:
      - postgresql
      - patroni
      - python3-psycopg2
    state: present

- name: Stop and disable default PostgreSQL service
  systemd:
    name: postgresql
    state: stopped
    enabled: no

- name: Remove default database cluster
  file:
    path: /var/lib/postgresql/14/main
    state: absent

- name: Deploy Patroni configuration
  template:
    src: patroni.yml.j2
    dest: /etc/patroni/config.yml
    owner: postgres
    group: postgres
  notify: Restart Patroni

- name: Start Patroni service
  systemd:
    name: patroni
    state: started
    enabled: yes
