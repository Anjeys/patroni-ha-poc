---
# Every version in one place. Exact apt versions on purpose: PGDG keeps only the
# latest build of each package, so a stale pin fails the run instead of silently
# installing something else. A bump is a deliberate commit.
postgresql_version: 18
postgresql_package_version: "18.6-1.pgdg24.04+2"
patroni_version: "4.1.5-2.pgdg24.04+1"
pgbackrest_version: "2.59.3-1.pgdg24.04+1"
pgbouncer_version: "1.26.1-1.pgdg24.04+1"
psycopg2_version: "2.9.10-1.pgdg24.04+1"
haproxy_version: "2.8.16-0ubuntu0.24.04.3"
# Ubuntu's build, like haproxy: upstream publishes source only, and a build
# toolchain for a VRRP daemon buys nothing this lab uses.
keepalived_version: "1:2.2.8-1build2"

# The address applications connect to; keepalived keeps it on a live balancer.
pg_access_vip: "172.{{ lab_net }}.0.100"

# Upstream release asset, SHA-256 from its SHA256SUMS. Ubuntu's package is 3.4.
etcd_version: "3.7.2"
etcd_sha256: "3a3679bc51a4ee9d30bccea1da7cd4fe62c6fc1d2ca1255068d2c53bf3026135"

pgdg_key_fingerprint: "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"

pg_data_dir: "/var/lib/postgresql/{{ postgresql_version }}/main"
pg_bin_dir: "/usr/lib/postgresql/{{ postgresql_version }}/bin"
