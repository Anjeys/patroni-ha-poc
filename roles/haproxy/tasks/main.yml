---
- name: Install HAProxy package
  apt:
    name: haproxy
    state: present

- name: Deploy HAProxy configuration
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
  notify: Restart HAProxy

- name: Start HAProxy service
  systemd:
    name: haproxy
    state: started
    enabled: yes
