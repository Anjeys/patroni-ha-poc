---
- name: Setup PostgreSQL HA Cluster
  hosts: etcd_nodes
  become: true
  roles:
    - pgdg
    - pgbackrest
    - etcd
    - patroni

- name: Setup Access Layer and Backup Repo
  hosts: balancers
  become: true
  roles:
    - pgdg
    - haproxy
    - pgbouncer
    - pgbackrest


- name: Backup repository (stanza, first full backup, schedule)
  hosts: balancers
  become: true
  roles:
    - pgbouncer_auth
    - pgbackrest_repo
