---
- name: Create the etcd system user
  ansible.builtin.user:
    name: etcd
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/etcd
    create_home: false

- name: Download the pinned etcd release
  ansible.builtin.get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: "/usr/local/src/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ etcd_sha256 }}"
    mode: "0644"

- name: Unpack
  ansible.builtin.unarchive:
    src: "/usr/local/src/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /usr/local/src
    remote_src: true
    creates: "/usr/local/src/etcd-v{{ etcd_version }}-linux-amd64/etcd"

- name: Install binaries
  ansible.builtin.copy:
    src: "/usr/local/src/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    mode: "0755"
  loop: [etcd, etcdctl, etcdutl]
  notify: Restart etcd

- name: Data directory
  ansible.builtin.file:
    path: /var/lib/etcd
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: Configuration
  ansible.builtin.template:
    src: etcd.j2
    dest: /etc/default/etcd
    mode: "0644"
  notify: Restart etcd

- name: Service unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify: Restart etcd

- name: Start etcd
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true
