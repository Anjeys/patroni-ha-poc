---
# Runs after the cluster is up. A stanza from a previous cluster (volume kept
# across a rebuild) fails every archive-push with ArchiveMismatchError, so the
# stanza is checked against the live system-id and recreated when it differs.
- name: Wait for a primary behind the load balancer
  ansible.builtin.command: >-
    psql -h {{ pg_access_vip }} -p 5000 -U postgres -Atc "select pg_is_in_recovery()"
  environment:
    PGPASSWORD: "{{ pg_superuser_password }}"
  register: pgbackrest_repo_probe
  until: pgbackrest_repo_probe.rc == 0 and pgbackrest_repo_probe.stdout == "f"
  retries: 30
  delay: 5
  changed_when: false

- name: Stanza status
  ansible.builtin.command: pgbackrest --stanza=main --output=json info
  become: true
  become_user: postgres
  register: pgbackrest_repo_info
  changed_when: false
  failed_when: false

- name: Parse the stanza record (empty list = no stanza yet)
  ansible.builtin.set_fact:
    pgbackrest_repo_stanza: >-
      {{ (pgbackrest_repo_info.stdout | from_json | first)
         if (pgbackrest_repo_info.rc == 0 and (pgbackrest_repo_info.stdout | from_json | length) > 0)
         else {} }}

# Through the VIP and HAProxy: 5000 always lands on the primary.
- name: Live system identifier
  ansible.builtin.command: >-
    psql -h {{ pg_access_vip }} -p 5000 -U postgres -Atc
    "select system_identifier from pg_control_system()"
  environment:
    PGPASSWORD: "{{ pg_superuser_password }}"
  register: pgbackrest_repo_sysid
  changed_when: false

# pgBackRest refuses to delete a stanza that is not stopped: a repository
# somebody is still archiving into must not disappear under them. The stop
# flag is the consent, --force only skips the "are there backups" question.
- name: Stanza belongs to another cluster -> stop, drop, allow archiving again
  when:
    - pgbackrest_repo_stanza.db is defined
    - pgbackrest_repo_stanza.db | length > 0
    - (pgbackrest_repo_stanza.db | last)['system-id'] | string != pgbackrest_repo_sysid.stdout
  become: true
  become_user: postgres
  block:
    - name: Stop archiving into the stale stanza
      ansible.builtin.command: pgbackrest --stanza=main stop
      changed_when: true

    - name: Drop it
      ansible.builtin.command: pgbackrest --stanza=main stanza-delete --force
      changed_when: true
  always:
    # A stop flag left behind blocks every archive-push from now on, so it is
    # removed whether the delete worked or not.
    - name: Allow archiving again
      ansible.builtin.command: pgbackrest --stanza=main start
      changed_when: true

# stanza-create is safe to repeat - it exits 0 and says so on stdout - but a
# task that reports "changed" every run hides the one run that really changed
# something. The stanza record read above already answers whether it exists.
- name: Create the stanza
  ansible.builtin.command: pgbackrest --stanza=main stanza-create
  become: true
  become_user: postgres
  register: pgbackrest_repo_create
  changed_when: pgbackrest_repo_create.rc == 0 and pgbackrest_repo_stanza.db | default([]) | length == 0

- name: Check archiving end to end
  ansible.builtin.command: pgbackrest --stanza=main check
  become: true
  become_user: postgres
  changed_when: false

- name: First full backup (only when none exists)
  ansible.builtin.command: pgbackrest --stanza=main --type=full backup
  become: true
  become_user: postgres
  when: pgbackrest_repo_stanza.backup | default([]) | length == 0

# A backup nobody has read is a file. verify reads every file in the
# repository against its stored checksum.
- name: Verify the repository
  ansible.builtin.command: pgbackrest --stanza=main verify
  become: true
  become_user: postgres
  changed_when: false

- name: The cron daemon must be running for a schedule to mean anything
  ansible.builtin.systemd:
    name: cron
    state: started
    enabled: true

- name: Nightly full, hourly incremental
  ansible.builtin.cron:
    name: "{{ item.name }}"
    user: postgres
    minute: "{{ item.minute }}"
    hour: "{{ item.hour }}"
    job: "pgbackrest --stanza=main --type={{ item.type }} backup"
  loop:
    - {name: pgbackrest full, type: full, minute: "0", hour: "2"}
    - {name: pgbackrest incr, type: incr, minute: "15", hour: "*"}

- name: Weekly repository verification
  ansible.builtin.cron:
    name: pgbackrest verify
    user: postgres
    minute: "0"
    hour: "4"
    weekday: "0"
    job: "pgbackrest --stanza=main verify"
