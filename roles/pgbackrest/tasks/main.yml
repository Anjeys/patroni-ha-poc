---
- name: Install pgBackRest package
  ansible.builtin.apt:
    name: "pgbackrest={{ pgbackrest_version }}"
    state: present

- name: Create directory for backup repository
  ansible.builtin.file:
    path: /var/lib/pgbackrest
    state: directory
    owner: postgres
    group: postgres
    mode: '0750'
  when: inventory_hostname in groups['backup_hosts']

- name: Deploy configuration for Repository
  ansible.builtin.template:
    src: pgbackrest-repo.conf.j2
    dest: /etc/pgbackrest.conf
  when: inventory_hostname in groups['backup_hosts']

- name: Install psql on the repository host (stanza checks and drills talk to the VIP)
  ansible.builtin.apt:
    name: "postgresql-client-{{ postgresql_version }}={{ postgresql_package_version }}"
    state: present
  when: inventory_hostname in groups['backup_hosts']

- name: Deploy configuration for Databases
  ansible.builtin.template:
    src: pgbackrest-client.conf.j2
    dest: /etc/pgbackrest.conf
  when: inventory_hostname in groups['etcd_nodes']

# Tasks that run as postgres need a module tmp it owns; creating it here keeps
# the first become_user from printing a warning about doing it on the fly.
- name: Ansible tmp for the postgres user
  ansible.builtin.file:
    path: /tmp/.ansible-postgres
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: SSH mesh so archive-push reaches the repository from the first WAL
  ansible.builtin.include_tasks: mesh.yml
